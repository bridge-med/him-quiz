name: Check question bank and app
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 公開バンクが生成元と一致しているか
        run: node tools/build.mjs --check
      - name: データ整合・学習ロジックのテスト
        run: node --test tests/*.test.mjs
