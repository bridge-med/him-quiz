<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HIM Quiz — 診療情報管理士 模擬問題集 | BRIDGE</title>
<meta name="description" content="診療情報管理士通信教育 専門課程の科目試験対策。12科目の検証済み問題、根拠資料つき解説、誤答と自信度にもとづく復習、模擬試験。">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,700;1,9..144,900&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">

<style>
/* ===== BRIDGE Design System v1.0 — Quiet Atelier / 職人の手記 ===== */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* 顔料 */
  --kami:#FAFAF7; --kami-2:#F4F1E8; --kami-3:#EDE8DD;
  --sumi:#0A0A0F; --sumi-2:#2A2A35; --sumi-3:#6E6E78; --sumi-4:#B8B5A8;
  --shu:#C8553D; --shu-deep:#A8442F; --shu-pale:#F4D5CB;
  --ai:#1B4965; --ai-deep:#0F2D44; --ai-pale:#C5D4E0;
  --moegi:#8A9A5B; --moegi-deep:#6B7A4F; --moegi-pale:#C8D4B0;
  --taisha:#8B5A2B; --taisha-deep:#6B4420; --taisha-pale:#D4B896;
  /* 旧名互換 */
  --bg:var(--kami-2); --ink:var(--sumi); --red:var(--shu); --faint:var(--sumi-4); --mid:var(--sumi-3);
  --green:var(--moegi-deep); --card:var(--kami); --expl:var(--kami-3);
  --radius:2px;
  --serif-jp:'Noto Serif JP',serif;
  --sans-jp:'Noto Sans JP',sans-serif;
  --serif-en:'Fraunces','Noto Serif JP',serif;
  --sans-en:'Inter','Noto Sans JP',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
body{font-family:var(--sans-jp);background:var(--kami-2);color:var(--sumi);line-height:1.7;min-height:100vh;padding-bottom:80px;font-feature-settings:"palt" 1;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:200;opacity:0.025;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");mix-blend-mode:multiply}
::selection{background:var(--shu);color:#fff}
.container{max-width:720px;margin:0 auto;padding:16px}
h1{font:900 28px/1.2 var(--serif-jp);text-align:center;margin:32px 0 8px;color:var(--sumi);letter-spacing:-0.02em}
h1::before{content:'BRIDGE · Product 03';display:block;font:800 9px/1 var(--sans-en);color:var(--shu);letter-spacing:0.3em;text-transform:uppercase;margin-bottom:14px;text-align:center}
.subtitle{text-align:center;color:var(--sumi-3);font:500 12px/1.6 var(--sans-jp);margin-bottom:24px;letter-spacing:0.04em}
.stats-bar{display:flex;justify-content:center;gap:8px;margin-bottom:24px;font-size:.82rem;color:var(--sumi-3);flex-wrap:wrap}
.stats-bar span{background:var(--kami);padding:5px 11px;border-radius:2px;border:1px solid var(--border,rgba(10,10,15,0.08));font:500 11px/1.4 var(--mono);letter-spacing:0.04em;color:var(--sumi-2)}
.top-actions{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:var(--radius);font-size:1rem;font-family:inherit;cursor:pointer;text-align:center;font-weight:500;transition:opacity .2s}
.btn:active{opacity:.7}
.btn-primary{background:var(--red);color:#fff}
.btn-secondary{background:var(--card);color:var(--ink);border:1px solid var(--faint)}
.btn-accent{background:var(--green);color:#fff}
.badge{display:inline-block;background:var(--shu);color:#fff;font:700 10px/1.3 var(--sans-en);padding:2px 8px;border-radius:2px;margin-left:6px;vertical-align:middle;letter-spacing:0.14em;text-transform:uppercase}
.chapter-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
@media(min-width:640px){.chapter-grid{grid-template-columns:1fr 1fr 1fr}}
.ch-card{background:var(--card);border-radius:var(--radius);padding:14px;cursor:pointer;border:1px solid var(--faint);transition:box-shadow .2s}
.ch-card:active{box-shadow:0 2px 8px rgba(0,0,0,.1)}
.ch-num{font-size:.75rem;color:var(--mid);font-weight:500}
.ch-name{font-size:.88rem;font-weight:700;margin:4px 0 8px;line-height:1.3}
.progress-track{height:4px;background:var(--kami-3);border-radius:0;overflow:hidden}
.progress-fill{height:100%;background:var(--moegi);border-radius:0;transition:width .3s}
.ch-score{font-size:.73rem;color:var(--mid);margin-top:6px}
.reset-area{text-align:center;margin:20px 0 40px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--sumi);border-radius:2px;padding:28px;max-width:360px;width:100%}
.modal h3{font-size:1.05rem;font-weight:700;margin-bottom:4px}
.modal .modal-sub{font-size:.82rem;color:var(--mid);margin-bottom:16px}
.modal-options{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.modal-opt{padding:14px;border:1px solid var(--faint);border-radius:var(--radius);background:var(--bg);cursor:pointer;font-size:.95rem;font-family:inherit;text-align:left;transition:border-color .15s}
.modal-opt:active{border-color:var(--red);background:var(--card)}
.modal-opt .opt-num{font-weight:700}
.modal-opt .opt-desc{font-size:.78rem;color:var(--mid)}
.modal-cancel{width:100%;padding:10px;border:none;background:none;color:var(--mid);font-family:inherit;font-size:.85rem;cursor:pointer}
.data-area{margin:16px 0;padding:16px;border-top:1px solid var(--faint)}
.data-area h4{font-size:.85rem;font-weight:700;color:var(--mid);margin-bottom:10px}
.data-btns{display:flex;gap:8px;flex-wrap:wrap}
.data-btn{padding:8px 14px;border:1px solid var(--sumi-4);border-radius:2px;background:var(--card);font:600 11px/1 var(--sans-jp);font-family:inherit;cursor:pointer;color:var(--sumi);letter-spacing:0.04em}
.data-btn:active{background:var(--faint)}
.import-input{display:none}
.reset-btn{background:none;border:1px solid var(--faint);color:var(--mid);padding:8px 20px;border-radius:var(--radius);font-size:.8rem;cursor:pointer;font-family:inherit}
.quiz-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.back-btn{background:none;border:none;font-size:1.3rem;cursor:pointer;padding:4px 8px}
.quiz-title{font-size:1rem;font-weight:700;flex:1}
.q-counter{font-size:.8rem;color:var(--mid)}
.progress-bar-wrap{margin-bottom:16px}
.q-card{background:var(--card);border-radius:var(--radius);padding:20px;border-left:4px solid var(--red);margin-bottom:12px;position:relative}
.q-card.correct{border-left-color:var(--green)}
.q-card.wrong{border-left-color:var(--red)}
.bookmark-btn{position:absolute;top:12px;right:12px;background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--faint);transition:color .2s}
.bookmark-btn.active{color:var(--taisha)}
.q-text{font-size:.95rem;font-weight:500;margin-bottom:16px;padding-right:30px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice-btn{background:var(--bg);border:1.5px solid var(--faint);border-radius:var(--radius);padding:12px 16px;font-size:.88rem;text-align:left;cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s;line-height:1.5}
.choice-btn:active{opacity:.8}
.choice-btn.selected{border-color:var(--sumi);background:var(--kami-3)}
.choice-btn.correct-choice{border-color:var(--moegi);background:var(--moegi-pale);color:var(--moegi-deep)}
.choice-btn.wrong-choice{border-color:var(--shu);background:var(--shu-pale);color:var(--shu-deep)}
.choice-btn[disabled]{cursor:default}
.result-icon{display:inline-block;width:20px;font-weight:700;margin-right:2px}
.explanation{background:var(--expl);border-radius:var(--radius);padding:16px;margin-top:12px;font-size:.84rem;line-height:1.8;display:none}
.explanation.show{display:block}
.expl-section{margin-bottom:10px}
.expl-section:last-child{margin-bottom:0}
.expl-label{font-weight:700;font-size:.78rem;margin-bottom:2px}
.expl-label.green{color:var(--green)}
.expl-label.red{color:var(--red)}
.expl-label.blue{color:var(--ai)}
.expl-wrong-item{margin-left:8px;padding-left:8px;border-left:2px solid var(--faint);margin-bottom:4px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--faint);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;z-index:100}
.nav-btn{padding:10px 24px;border:1px solid var(--faint);border-radius:var(--radius);background:var(--card);font-family:inherit;font-size:.9rem;cursor:pointer}
.nav-btn:disabled{opacity:.3;cursor:default}
.nav-btn.primary{background:var(--red);color:#fff;border-color:var(--red)}
.nav-center{font-size:.8rem;color:var(--mid)}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px;text-align:center;margin-bottom:16px}
.result-score{font-size:2.5rem;font-weight:700;color:var(--green)}
.result-label{font-size:.9rem;color:var(--mid);margin-top:4px}
.result-list{margin-top:16px;text-align:left}
.result-list-item{padding:10px 12px;border-bottom:1px solid var(--faint);font-size:.84rem}
.result-list-item:hover{background:var(--expl)}
.hidden{display:none!important}
.fade-in{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
footer{text-align:center;font-size:.72rem;color:var(--mid);padding:20px 0 40px}
/* ===== v8 追加（既存トークンのみ使用） ===== */
.sec-h{font:700 13px/1.4 var(--sans-jp);color:var(--sumi-2);margin:22px 0 10px;letter-spacing:0.04em}
.banner{background:var(--kami);border:1px solid var(--sumi-4);border-left:4px solid var(--ai);padding:10px 12px;font-size:.8rem;line-height:1.6;margin-bottom:12px}
.banner.warn{border-left-color:var(--shu)}
.banner-actions{display:inline-flex;gap:8px;margin-left:8px}
.link-btn{background:none;border:none;color:var(--ai);font:inherit;font-weight:700;cursor:pointer;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.tiles.tiles-3{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--kami);border:1px solid rgba(10,10,15,0.08);padding:7px 6px 6px;min-width:0}
.tile-num{font:700 17px/1.2 var(--sans-en);color:var(--sumi)}
.tile-label{font:700 10px/1.35 var(--sans-jp);color:var(--sumi-2);margin-top:1px;white-space:nowrap}
.tile-sub{font:500 9px/1.35 var(--sans-jp);color:var(--sumi-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:560px){.tile{padding:10px 10px 8px}.tile-num{font-size:20px}.tile-label{font-size:11px}.tile-sub{font-size:10px}}
.plan-row{display:flex;flex-direction:column;gap:4px;background:var(--kami);border:1px solid rgba(10,10,15,0.08);padding:8px 12px;margin-bottom:14px;font-size:.78rem;line-height:1.55}
.plan-row input[type=date]{font:inherit;font-size:16px;padding:4px 6px;border:1px solid var(--sumi-4);border-radius:2px;background:var(--kami-2);color:var(--sumi);margin-left:6px}
.plan-text strong{color:var(--shu-deep);font-weight:700;margin:0 2px}
.btn-sub{display:block;font-size:.72rem;font-weight:500;opacity:.85;margin-top:2px}
.seg{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.seg-label{font:700 12px/1.3 var(--sans-jp);color:var(--sumi-2);min-width:5.5em}
.seg-btn{flex:1;padding:12px 4px;border:1px solid var(--faint);background:var(--card);font:600 .95rem/1 var(--sans-jp);border-radius:var(--radius);cursor:pointer;color:var(--sumi);min-height:44px}
.seg-btn:active{opacity:.7}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meta-chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;padding-right:30px}
.chip{font:500 10px/1.5 var(--sans-jp);color:var(--sumi-2);background:var(--kami-3);padding:1px 7px;border-radius:2px}
.case-panel{background:var(--kami);border:1px solid var(--sumi-4);margin-bottom:12px}
.case-panel summary{cursor:pointer;padding:10px 12px;font:700 .82rem/1.5 var(--sans-jp);color:var(--ai-deep)}
.case-text{white-space:pre-wrap;padding:0 12px 12px;font-size:.84rem;line-height:1.75;max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.answer-line{margin-top:12px;font-weight:700;font-size:.9rem}
.answer-line.ok{color:var(--green)}
.answer-line.ng{color:var(--shu-deep)}
.conf-row{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.conf-label{font:700 .75rem/1 var(--sans-jp);color:var(--sumi-3)}
.conf-btn{padding:8px 12px;min-height:40px;border:1px solid var(--faint);background:var(--kami-2);border-radius:20px;font:500 .8rem/1 var(--sans-jp);cursor:pointer;color:var(--sumi)}
.conf-btn.on{background:var(--ai);border-color:var(--ai);color:#fff}
.conf-hint{font-size:.7rem;color:var(--sumi-3)}
.src-list{margin:4px 0 4px 1.2em}
.src-list a{color:var(--ai);word-break:break-all}
.asof{font-size:.72rem;color:var(--sumi-3);margin-top:4px}
.rel-btn{margin-top:10px}
.exam-timer{font:700 .85rem/1 var(--mono);color:var(--sumi-2);margin-right:4px}
.exam-timer.low{color:var(--shu)}
.pal-open{border:1px solid var(--faint);background:var(--card);padding:6px 10px;font:600 .78rem/1 var(--sans-jp);border-radius:2px;cursor:pointer;min-height:36px}
.q-card.exam{border-left-color:var(--ai)}
.flag-btn{position:absolute;top:10px;right:10px;border:1px solid var(--faint);background:var(--kami-2);font:600 .72rem/1 var(--sans-jp);padding:7px 9px;border-radius:2px;cursor:pointer;color:var(--sumi-2)}
.flag-btn.on{background:var(--taisha-pale);border-color:var(--taisha);color:var(--taisha-deep)}
.q-card.exam .q-text{padding-right:70px}
.exam-note{font-size:.72rem;text-align:center;margin-top:4px}
.modal.wide{max-width:520px}
.modal-options.scroll{max-height:60vh;overflow-y:auto}
.modal-opt.primary{background:var(--shu);color:#fff;border-color:var(--shu);text-align:center;font-weight:700}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:10px 0 12px;max-height:46vh;overflow-y:auto}
.pal-btn{min-height:42px;border:1px solid var(--sumi-4);background:var(--kami);font:600 .82rem/1 var(--sans-en);cursor:pointer;border-radius:2px;position:relative;color:var(--sumi)}
.pal-btn.ans{background:var(--ai-pale);border-color:var(--ai)}
.pal-btn.flag::after{content:'';position:absolute;top:3px;right:3px;width:7px;height:7px;background:var(--taisha);border-radius:50%}
.pal-btn.cur{outline:2px solid var(--sumi);outline-offset:1px}
.result-card.left{text-align:left}
.rc-h{font-weight:700;margin-bottom:10px}
.rl-q{font-weight:500;margin-bottom:4px}
.rl-ng{color:var(--shu-deep);font-size:.8rem}
.rl-ok{color:var(--green);font-size:.8rem}
.btnlike{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--faint);font:inherit;font-size:.84rem;cursor:pointer;color:var(--sumi)}
.mark{display:inline-block;width:1.4em;font-weight:700}
.mark.ok{color:var(--green)}.mark.ng{color:var(--shu-deep)}
.pass{margin-top:12px;padding:10px;font-weight:700;color:#fff;border-radius:var(--radius)}
.pass.ok{background:var(--green)}.pass.ng{background:var(--shu)}
.subj-table{margin-top:14px;text-align:left}
.st-row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--faint);font-size:.82rem}
.st-row .ok{color:var(--green)}.st-row .ng{color:var(--shu-deep)}
.small{font-size:.72rem}
.muted{color:var(--sumi-3);font-size:.8rem}
.sub-list{display:flex;flex-direction:column;gap:6px;margin-bottom:24px}
.sub-row{display:grid;grid-template-columns:1fr;gap:4px;text-align:left;background:var(--card);border:1px solid var(--faint);padding:10px 12px;cursor:pointer;font:inherit;border-radius:var(--radius);color:var(--sumi)}
.sub-name{font-weight:700;font-size:.86rem}
.sub-meta{font-size:.72rem;color:var(--sumi-3)}
.record{background:var(--kami);border:1px solid rgba(10,10,15,0.08);padding:0 12px;margin:8px 0 16px}
.record summary{cursor:pointer;padding:12px 0;font:700 .84rem/1.4 var(--sans-jp)}
.rec-sec{margin-bottom:14px}
.rec-h{font:700 .78rem/1.4 var(--sans-jp);color:var(--sumi-2);margin-bottom:6px}
.hist{list-style:none}
.hist li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--faint);font-size:.78rem}
.hist li span:first-child{flex:1}
.spark{width:100%;height:56px;display:block;margin-bottom:6px}
.spark-line{fill:none;stroke:var(--ai);stroke-width:2}
.spark-60{stroke:var(--shu);stroke-width:1;stroke-dasharray:4 3}
.data-btn.danger{color:var(--red);border-color:var(--red)}
.ch-card.empty{opacity:.55;cursor:default}
.data-note{font-size:.72rem;color:var(--sumi-3);margin-top:8px;line-height:1.6}
.disclaimer{font-size:.7rem;color:var(--sumi-3);line-height:1.7;margin:8px 0 0}
.choice-btn{min-height:44px}
.choice-btn:focus-visible,.btn:focus-visible,.seg-btn:focus-visible,.conf-btn:focus-visible,.pal-btn:focus-visible,.ch-card:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.bottom-nav{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
</style>
</head>
